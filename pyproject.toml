[build-system]
requires      = ["setuptools >= 80"]
build-backend = "setuptools.build_meta"

[project]
name            = "PanoSAMic"
version         = "2.2"
requires-python = ">=3.11"                                                                                                          # measured using vermin
readme          = "README.md"
description     = "PanoSAMic: Semantic segmentation for panoramic images using SAM with multi-modal fusion and spherical attention"

license = { text = "LICENSE" }

authors     = [{ name = "Mahdi Chamseddine", email = "mahdi.chamseddine@dfki.de" }]
maintainers = [{ name = "Mahdi Chamseddine", email = "mahdi.chamseddine@dfki.de" }]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "huggingface-hub",
    "pytorch-optimizer",
    "safetensors",
    "segment-anything",
    "standard-imghdr",   # Temporary fix for tensorboard with python 3.13
    "tensorboard",
    "torch",
    "torchvision",
    "torchaudio",
    "tqdm",
]

[dependency-groups]
dev = ["pre-commit>=4.6.0", "pytest>=9.0.3", "ruff>=0.15.16", "ty>=0.0.46"]

[project.urls]
Homepage   = "https://github.com/dfki-av/PanoSAMic"
Repository = "https://github.com/dfki-av/PanoSAMic"
Issues     = "https://github.com/dfki-av/PanoSAMic/issues"

[project.optional-dependencies]
flops = ["fvcore"] # to measure model flops
sam3 = [ # to run sam3 experiments
    "decord",
    "einops",
    "ftfy",
    "iopath",
    "psutil",
    "pycocotools",
    "regex",
    "timm",
    "typing-extensions",
]

[tool.setuptools.packages.find]
include = ["panosamic*"]

[tool.ruff]
exclude      = [".eggs", ".git", ".venv"]
line-length  = 88                         # same as black
indent-width = 4

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long — handled by formatter
    "B008", # do not perform function calls in default arguments (common in argparse)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B007"] # loop variable not used in loop body

[tool.ty.environment]
python = ".venv"

[tool.uv.sources]
# potentially fork segment-anything to maintain compatibility
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }
# sam3             = { git = "https://github.com/facebookresearch/sam3.git" }
